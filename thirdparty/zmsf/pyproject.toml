[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zmsf"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["zmsf*"]

# Package structure
# package/
# ├── package/
# │   ├── module1.py
# │   └── module2.py
# |   └── subpackage/
# │       └── module3.py
# └── pyproject.toml